name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: reproducible builds, and F-Droid's recipe reads this line
          # to check out the matching Flutter revision.
          flutter-version: '3.47.2'

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          flutter build apk --release --dart-define=APP_VERSION=${VERSION}

      - name: Stage APK
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist
          mv build/app/outputs/flutter-apk/app-release.apk \
             dist/screenguard-android-${VERSION}.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/screenguard-android-*.apk
          generate_release_notes: true
